<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Cine Mania</title>
  </head>
  <body>
    <header>
      <nav class="my-navbar">
        <img
          src="./assets/img/logoCineMania.png"
          alt="Logo Cine Mania "
          class="logo"
        />
        <ul>
          <li><a href="./index.html">INICIO</a></li>
          <li><a href="./movies.html">PELICULAS</a></li>
          <li><a href="./lastestNews.html">NOTICIAS</a></li>
          <li><a href="./addMovies.html">AGREGAR PELICULAS</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card shadow-lg p-4">
              <h2 class="text-center mb-4 fw-bold" style="font-size: 1.8rem">
                AGREGAR PELÍCULA
              </h2>

              <form id="movieForm">
                <!-- Título -->
                <div class="mb-3">
                  <label class="form-label fw-bold">Título</label>
                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    placeholder="Ej: Inception"
                    name="title"
                  />
                </div>

                <!-- Año -->
                <div class="mb-3">
                  <label class="form-label fw-bold">Año</label>
                  <input
                    type="number"
                    class="form-control"
                    id="year"
                    min="1900"
                    max="2026"
                    placeholder="Ej: 2010"
                    name="year"
                  />
                </div>

                <!-- Director -->
                <div class="mb-3">
                  <label class="form-label fw-bold">Director</label>
                  <input
                    type="text"
                    class="form-control"
                    id="director"
                    placeholder="Ej: Christopher Nolan"
                    name="director"
                  />
                </div>

                <!-- Duración (horas y minutos) -->
                <div class="mb-3">
                  <label class="form-label fw-bold">Duración</label>

                  <div class="row">
                    <div class="col-6">
                      <input
                        type="text"
                        class="form-control"
                        id="duration"
                        placeholder="Ej: 1h 26min"
                        name="duration"
                      />
                    </div>
                  </div>
                </div>

                <!-- Géneros  -->
                <div class="mb-3">
                  <label class="form-label fw-bold">Géneros</label>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Acción"
                      id="gen-accion"
                    />
                    <label class="form-check-label" for="gen-accion"
                      >Acción</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Aventura"
                      id="gen-aventura"
                    />
                    <label class="form-check-label" for="gen-aventura"
                      >Aventura</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Drama"
                      id="gen-drama"
                    />
                    <label class="form-check-label" for="gen-drama"
                      >Drama</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Terror"
                      id="gen-terror"
                    />
                    <label class="form-check-label" for="gen-terror"
                      >Terror</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Comedia"
                      id="gen-comedia"
                    />
                    <label class="form-check-label" for="gen-comedia"
                      >Comedia</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Fantasía"
                      id="gen-fantasia"
                    />
                    <label class="form-check-label" for="gen-fantasia"
                      >Fantasía</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value="Ciencia ficción"
                      id="gen-scifi"
                    />
                    <label class="form-check-label" for="gen-scifi"
                      >Ciencia ficción</label
                    >
                  </div>
                </div>
                <!-- Rating -->
                <div class="mb-3">
                  <label class="form-label fw-bold"
                    >Calificación (Rating)</label
                  >
                  <input
                    type="number"
                    step="0.1"
                    min="0"
                    max="10"
                    class="form-control"
                    id="rating"
                    placeholder="Ej: 8.7"
                    name="rate"
                  />
                </div>

                <!-- Poster URL -->
                <div class="mb-3">
                  <label class="form-label fw-bold">Poster (URL)</label>
                  <input
                    type="url"
                    class="form-control"
                    id="poster"
                    placeholder="https://ejemplo.com/poster.jpg"
                    name="poster"
                  />
                </div>

                <!-- Botón -->
                <div class="d-flex gap-3">
                  <button class="btn btn-primary btn-lg w-100" type="submit">
                    Agregar Película
                  </button>

                  <button class="btn btn-secondary btn-lg w-100" type="reset">
                    Reset
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p>© 2025 Cine Mania.</p>
      <p>Desarrollado por Valentin Lorenzo.</p>
    </footer>

    <script src="./public/bundle.js"></script>
  </body>
</html>
